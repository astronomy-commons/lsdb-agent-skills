name: portability
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # weekly link check
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: portability rules
        run: bash scripts/check_portability.sh
      - name: links
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        run: bash scripts/check_portability.sh --links
